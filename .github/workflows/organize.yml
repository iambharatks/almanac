name: Auto-Organize to Leetcode Branch
on:
  push:
    branches:
      - main

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize and Push
        run: |
          git config --global user.name "iambharatks@gmail.com"
          git config --global user.email "iambharatks@gmail.com"
          
          # Switch to (or create) the leetcode branch
          git checkout -B leetcode
          
          # Create target directory
          mkdir -p dsa/leetcode

          # Iterate through top-level directories
          for dir in */; do
            dir_name=${dir%/}
            
            # The 'if' block ensures we NEVER move the 'dsa' or system folders
            if [[ "$dir_name" != "dsa" && "$dir_name" != ".git" && "$dir_name" != ".github" ]]; then
              echo "Moving $dir_name to dsa/leetcode/"
              
              # Use -T (no-target-directory) to ensure we move the folder itself,
              # not its contents, and avoid accidentally merging into an existing folder.
              mv -T "$dir_name" "dsa/leetcode/$dir_name"
              
              # Explicitly remove the source if it still exists (Safety check)
              if [ -d "$dir_name" ]; then
                rm -rf "$dir_name"
              fi
            fi
          done

          # Commit only if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git add dsa/leetcode/
            git commit -m "Auto-organized: Move new problems into dsa/leetcode/"
            git push origin leetcode
          else
            echo "No new problems to organize."
          fi
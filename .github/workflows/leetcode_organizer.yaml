name: Organize LeetHub Submissions

on:
  push:
    branches:
      - leetcode 

jobs:
  organize-leetcode-branch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: leetcode
          fetch-depth: 2 # Fetches enough history to read the previous commit message

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move Root Submissions to dsa/leetcode/
        run: |
          # Protected directories that should never be moved
          PROTECTED_DIRS=(
            "dsa" 
            ".github" 
            ".git" 
            ".vscode"     
            ".idea"       
            "venv"        
            ".venv"
            "env"
            "node_modules" 
            "__pycache__"  
          )
          
          # Find all directories in root, ignoring the current directory '.'
          ROOT_DIRS=$(find . -maxdepth 1 -type d -not -name '.' | sed 's|^\./||')
          
          DIRS_TO_MOVE=()
          for DIR in $ROOT_DIRS; do
            IS_PROTECTED=false
            for PROTECT in "${PROTECTED_DIRS[@]}"; do
              if [ "$DIR" == "$PROTECT" ]; then
                IS_PROTECTED=true
                break
              fi
            done
            
            if [ "$IS_PROTECTED" = false ]; then
              DIRS_TO_MOVE+=("$DIR")
            fi
          done

          if [ ${#DIRS_TO_MOVE[@]} -eq 0 ]; then
            echo "No root submissions to move."
            exit 0
          fi

          mkdir -p dsa/leetcode/
          for DIR in "${DIRS_TO_MOVE[@]}"; do
            echo "Moving $DIR into dsa/leetcode/"
            # Copy all files recursively and force-overwrite duplicates
            cp -rf "$DIR/." "dsa/leetcode/$DIR/"
            # Remove the original folder from root
            rm -rf "$DIR"
          done

          git add -A
          
          # Extract the exact commit message from LeetHub
          git log -1 --pretty=%B > commit_message.txt
          
          # Append the skip-ci flag so we don't cause an infinite loop
          echo "" >> commit_message.txt
          echo "[skip ci]" >> commit_message.txt
          
          # Commit using the preserved message and clean up
          git commit -F commit_message.txt
          rm commit_message.txt
          
          git push origin leetcode
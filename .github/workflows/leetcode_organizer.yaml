name: Organize LeetHub Submissions

on:
  push:
    branches:
      - leetcode

jobs:
  organize-leetcode-branch:
    # Ensure we don't trigger the action from its own commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: leetcode
          fetch-depth: 1

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move Root Submissions to dsa/leetcode/
        run: |
          # 1. Define authorized directories that we should NOT move
          # We keep 'dsa' and '.github' where they are
          AUTHORIZED_DIRS=("dsa" ".github")
          
          # 2. Find all directories in the root
          ROOT_DIRS=$(find . -maxdepth 1 -type d -not -name '.' | sed 's|^\./||')
          
          DIRS_TO_MOVE=()
          for DIR in $ROOT_DIRS; do
            IS_AUTHORIZED=false
            for AUTH in "${AUTHORIZED_DIRS[@]}"; do
              if [ "$DIR" == "$AUTH" ]; then
                IS_AUTHORIZED=true
                break
              fi
            done
            
            if [ "$IS_AUTHORIZED" = false ]; then
              DIRS_TO_MOVE+=("$DIR")
            fi
          done

          # 3. If nothing needs moving, exit
          if [ ${#DIRS_TO_MOVE[@]} -eq 0 ]; then
            echo "No folders found in root to move."
            exit 0
          fi

          # 4. Create the target directory and move the folders
          mkdir -p dsa/leetcode/
          for DIR in "${DIRS_TO_MOVE[@]}"; do
            echo "Moving $DIR to dsa/leetcode/"
            mv "$DIR" dsa/leetcode/
          done

          # 5. Commit and Push
          git add dsa/
          git commit -m "chore: organize submissions into dsa/leetcode/ [skip ci]"
          git push origin leetcode
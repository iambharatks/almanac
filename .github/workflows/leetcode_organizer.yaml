name: Organize LeetHub Submissions

on:
  push:
    branches:
      - leetcode 

jobs:
  organize-leetcode-branch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: leetcode
          fetch-depth: 1

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move Root Submissions to dsa/leetcode/
        run: |
          # Protected directories that should never be moved
          PROTECTED_DIRS=(
            "dsa" 
            ".github" 
            ".git" 
            ".vscode"     
            ".idea"       
            "venv"        
            ".venv"
            "env"
            "node_modules" 
            "__pycache__"  
          )
          
          # Find all directories in root, ignoring the current directory '.'
          ROOT_DIRS=$(find . -maxdepth 1 -type d -not -name '.' | sed 's|^\./||')
          
          DIRS_TO_MOVE=()
          for DIR in $ROOT_DIRS; do
            IS_PROTECTED=false
            for PROTECT in "${PROTECTED_DIRS[@]}"; do
              if [ "$DIR" == "$PROTECT" ]; then
                IS_PROTECTED=true
                break
              fi
            done
            
            if [ "$IS_PROTECTED" = false ]; then
              DIRS_TO_MOVE+=("$DIR")
            fi
          done

          if [ ${#DIRS_TO_MOVE[@]} -eq 0 ]; then
            echo "No root submissions to move."
            exit 0
          fi

          mkdir -p dsa/leetcode/
          for DIR in "${DIRS_TO_MOVE[@]}"; do
            echo "Moving $DIR into dsa/leetcode/"
            mv "$DIR" dsa/leetcode/
          done

          # THE FIX: 'git add -A' tracks both the newly moved files AND the root deletions
          git add -A
          git commit -m "chore: auto-organize new LeetCode submissions [skip ci]"
          git push origin leetcode